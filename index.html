<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Genre Sorter (Pure JS)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; background: #121212; color: #eee; }
    h1 { color: #1DB954; margin-bottom: 0.25rem; }
    .sub { color: #999; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .card { background: #1e1e1e; padding: 1.25rem; border-radius: 10px; margin-bottom: 1rem; }
    select, input, button { padding: 0.55rem 0.85rem; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 0.95rem; }
    button { background: #1DB954; color: #000; font-weight: 600; border: none; cursor: pointer; }
    button.secondary { background: #333; color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .genres { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .chip { padding: 0.4rem 0.75rem; border-radius: 999px; background: #2d2d2d; cursor: pointer; border: 1px solid #444; user-select: none; font-size: 0.9rem; }
    .chip.active { background: #1DB954; color: #000; border-color: #1DB954; font-weight: 600; }
    .track-list { max-height: 240px; overflow-y: auto; font-size: 0.88rem; border-top: 1px solid #333; margin-top: 0.75rem; padding-top: 0.5rem; line-height: 1.5; }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-top: 0.6rem; }
    code { background: #2a2a2a; padding: 0.15rem 0.35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Spotify Genre Sorter</h1>
  <div class="sub">100 % Browser-JavaScript (kein Node, kein Python/pip). Redirect-URI: <code id="redirectHint"></code></div>

  <!-- Login / Setup -->
  <div id="loginBox" class="card" style="display:none;">
    <strong>Mit Spotify verbinden</strong>
    <div class="row">
      <input id="clientIdInput" placeholder="Spotify Client ID einfügen" style="min-width:300px;" />
      <button onclick="startLogin()">Mit Spotify einloggen</button>
    </div>
    <p style="color:#aaa; font-size:0.85rem; margin-bottom:0;">
      Trage die oben angezeigte Redirect-URI exakt so im Spotify Developer Dashboard ein.
    </p>
  </div>

  <!-- Haupt-App -->
  <div id="appBox" style="display:none;">
    <div class="card">
      <div class="row" style="justify-content: space-between; margin-top: 0;">
        <strong>1. Quell-Playlist wählen</strong>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>
      <div class="row">
        <select id="sourcePlaylist"></select>
        <button id="scanBtn" onclick="scanPlaylist()">Genres scannen</button>
      </div>
      <p id="scanStatus" style="color:#aaa; font-size:0.9rem; margin-bottom:0;"></p>
    </div>

    <div id="genreBox" class="card" style="display:none;">
      <strong>2. Genres auswählen (Mehrfachauswahl)</strong>
      <div id="genreChips" class="genres"></div>
      <div id="preview" class="track-list"></div>
    </div>

    <div id="targetBox" class="card" style="display:none;">
      <strong>3. Ziel &amp; Aktion</strong>
      <div class="row">
        <select id="targetMode" onchange="toggleTargetInputs()">
          <option value="new">Neue Playlist erstellen</option>
          <option value="existing">Bestehende Playlist verwenden</option>
        </select>
        <input id="newPlaylistName" placeholder="Name der neuen Playlist" />
        <select id="targetPlaylist" style="display:none;"></select>
      </div>
      <div class="row" style="margin-top:0.8rem;">
        <label><input type="radio" name="actionMode" value="copy" checked /> Kopieren</label>
        <label><input type="radio" name="actionMode" value="move" /> Verschieben (aus Quelle entfernen)</label>
        <button id="transferBtn" onclick="executeTransfer()">Ausführen</button>
      </div>
      <p id="transferStatus" style="margin-bottom:0;"></p>
    </div>
  </div>

  <script>
    const SCOPES = [
      'playlist-read-private',
      'playlist-read-collaborative',
      'playlist-modify-public',
      'playlist-modify-private'
    ].join(' ');

    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const IGNORED_TAGS = new Set(['seen live', 'favorites', 'favourite', 'albums i own', 'spotify', 'under 2000 listeners']);

    let allTracks = [];
    let selectedGenres = new Set();

    document.getElementById('redirectHint').textContent = REDIRECT_URI;

    // === PKCE HELPER ===
    function generateRandomString(length) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      const bytes = crypto.getRandomValues(new Uint8Array(length));
      return Array.from(bytes, b => chars[b % chars.length]).join('');
    }

    async function sha256Base64Url(plain) {
      const data = new TextEncoder().encode(plain);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode(...new Uint8Array(hash)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // === OAUTH FLOW ===
    async function startLogin() {
      const clientId = document.getElementById('clientIdInput').value.trim();
      if (!clientId) return alert('Bitte zuerst deine Spotify Client ID eingeben.');
      localStorage.setItem('sp_client_id', clientId);

      const verifier = generateRandomString(64);
      const challenge = await sha256Base64Url(verifier);
      const state = generateRandomString(16);

      sessionStorage.setItem('pkce_verifier', verifier);
      sessionStorage.setItem('pkce_state', state);

      const params = new URLSearchParams({
        response_type: 'code',
        client_id: clientId,
        scope: SCOPES,
        redirect_uri: REDIRECT_URI,
        state,
        code_challenge_method: 'S256',
        code_challenge: challenge
      });
      window.location.href = `https://accounts.spotify.com/authorize?${params}`;
    }

    async function handleOAuthCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');

      if (error) {
        alert('Spotify Login abgebrochen: ' + error);
        window.history.replaceState({}, '', window.location.pathname);
        return;
      }
      if (!code) return;

      const expectedState = sessionStorage.getItem('pkce_state');
      const verifier = sessionStorage.getItem('pkce_verifier');
      const clientId = localStorage.getItem('sp_client_id');

      if (!verifier || state !== expectedState) {
        alert('Ungültiger OAuth-State.');
        return;
      }

      const resp = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: clientId,
          grant_type: 'authorization_code',
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier
        })
      });

      window.history.replaceState({}, '', window.location.pathname);
      if (!resp.ok) {
        alert('Token-Tausch fehlgeschlagen: ' + await resp.text());
        return;
      }

      const data = await resp.json();
      saveTokens(data);
    }

    function saveTokens(data) {
      localStorage.setItem('sp_access_token', data.access_token);
      if (data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
      localStorage.setItem('sp_expires_at', String(Date.now() + (data.expires_in - 60) * 1000));
    }

    async function refreshAccessToken() {
      const refreshToken = localStorage.getItem('sp_refresh_token');
      const clientId = localStorage.getItem('sp_client_id');
      if (!refreshToken || !clientId) return false;

      const resp = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type: 'refresh_token',
          refresh_token: refreshToken,
          client_id: clientId
        })
      });
      if (!resp.ok) return false;
      saveTokens(await resp.json());
      return true;
    }

    function logout() {
      localStorage.removeItem('sp_access_token');
      localStorage.removeItem('sp_refresh_token');
      localStorage.removeItem('sp_expires_at');
      location.reload();
    }

    async function spotifyFetch(url, options = {}) {
      if (Date.now() > Number(localStorage.getItem('sp_expires_at') || 0)) {
        await refreshAccessToken();
      }
      const doFetch = () => fetch(url, {
        ...options,
        headers: {
          'Authorization': `Bearer ${localStorage.getItem('sp_access_token')}`,
          ...(options.headers || {})
        }
      });

      let resp = await doFetch();
      if (resp.status === 401 && await refreshAccessToken()) {
        resp = await doFetch();
      }
      if (resp.status === 401) {
        logout();
        throw new Error('Sitzung abgelaufen.');
      }
      return resp;
    }

    // === PLAYLISTS & GENRES ===
    async function loadPlaylists() {
      const meResp = await spotifyFetch('https://api.spotify.com/v1/me');
      const me = await meResp.json();

      const src = document.getElementById('sourcePlaylist');
      const tgt = document.getElementById('targetPlaylist');
      src.innerHTML = '';
      tgt.innerHTML = '';

      let url = 'https://api.spotify.com/v1/me/playlists?limit=50';
      while (url) {
        const resp = await spotifyFetch(url);
        const data = await resp.json();
        for (const pl of data.items || []) {
          const readable = (pl.owner?.id === me.id) || pl.collaborative;
          if (readable) {
            src.add(new Option(`${pl.name} (${pl.owner?.display_name || ''})`, pl.id));
            tgt.add(new Option(pl.name, pl.id));
          }
        }
        url = data.next;
      }
    }

    function loadGenreCache() {
      try { return JSON.parse(localStorage.getItem('mb_genre_cache') || '{}'); }
      catch { return {}; }
    }

    function saveGenreCache(cache) {
      localStorage.setItem('mb_genre_cache', JSON.stringify(cache));
    }

    async function fetchMusicBrainzGenres(artistName, cache) {
      const key = artistName.trim().toLowerCase();
      if (key in cache) return cache[key];

      // Rate-Limit ~1 Req/Sek beachten
      await sleep(1100);
      const q = encodeURIComponent(`artist:"${artistName}"`);
      try {
        const resp = await fetch(`https://musicbrainz.org/ws/2/artist/?query=${q}&fmt=json&limit=1`);
        if (resp.status === 503 || resp.status === 429) {
          await sleep(2500);
          return [];
        }
        if (!resp.ok) return [];
        const data = await resp.json();
        const tags = data.artists?.[0]?.tags || [];
        const genres = tags
          .filter(t => (t.count || 0) >= 1 && !IGNORED_TAGS.has(t.name.toLowerCase()))
          .sort((a, b) => (b.count || 0) - (a.count || 0))
          .slice(0, 4)
          .map(t => t.name.toLowerCase());
        cache[key] = genres;
        return genres;
      } catch {
        return [];
      }
    }

    async function scanPlaylist() {
      const playlistId = document.getElementById('sourcePlaylist').value;
      const btn = document.getElementById('scanBtn');
      const status = document.getElementById('scanStatus');
      btn.disabled = true;

      try {
        status.textContent = 'Lade Playlist-Items...';
        const tracks = [];
        const uniqueArtists = new Set();

        let url = `https://api.spotify.com/v1/playlists/${playlistId}/items?limit=50`;
        while (url) {
          const resp = await spotifyFetch(url);
          if (!resp.ok) throw new Error('Kein Zugriff auf diese Playlist (im Dev Mode nur eigene/kollaborative).');
          const data = await resp.json();

          for (const entry of data.items || []) {
            if (entry.is_local) continue;
            const item = entry.item || entry.track;
            if (!item || item.type !== 'track' || !item.uri) continue;

            const artists = (item.artists || []).map(a => a.name).filter(Boolean);
            artists.forEach(a => uniqueArtists.add(a));

            const spotifyGenres = (item.artists || []).flatMap(a => a.genres || []).map(g => g.toLowerCase());
            tracks.push({ uri: item.uri, name: item.name, artists, genres: new Set(spotifyGenres) });
          }
          url = data.next;
        }

        const cache = loadGenreCache();
        const artistList = Array.from(uniqueArtists);
        const artistGenres = {};

        for (let i = 0; i < artistList.length; i++) {
          const name = artistList[i];
          const cached = name.trim().toLowerCase() in cache;
          if (!cached) {
            status.textContent = `Scanne Genres (${i + 1}/${artistList.length} Artists): ${name}...`;
          }
          artistGenres[name] = await fetchMusicBrainzGenres(name, cache);
          if (!cached && i % 10 === 0) saveGenreCache(cache);
        }
        saveGenreCache(cache);

        const genreCounts = {};
        for (const t of tracks) {
          for (const a of t.artists) {
            (artistGenres[a] || []).forEach(g => t.genres.add(g));
          }
          t.genreList = t.genres.size ? Array.from(t.genres) : ['unbekannt'];
          for (const g of t.genreList) {
            genreCounts[g] = (genreCounts[g] || 0) + 1;
          }
        }

        allTracks = tracks;
        selectedGenres.clear();
        const sortedGenres = Object.entries(genreCounts)
          .map(([genre, count]) => ({ genre, count }))
          .sort((a, b) => b.count - a.count);

        status.textContent = `Fertig: ${tracks.length} Songs, ${sortedGenres.length} Genres gefunden (im Browser gecacht).`;
        renderGenres(sortedGenres);
      } catch (err) {
        status.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function renderGenres(genres) {
      const container = document.getElementById('genreChips');
      container.innerHTML = '';
      genres.forEach(({ genre, count }) => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = `${genre} (${count})`;
        chip.onclick = () => {
          if (selectedGenres.has(genre)) selectedGenres.delete(genre);
          else selectedGenres.add(genre);
          chip.classList.toggle('active');
          updatePreview();
        };
        container.appendChild(chip);
      });
      document.getElementById('genreBox').style.display = 'block';
      document.getElementById('targetBox').style.display = 'block';
      updatePreview();
    }

    function getMatchingTracks() {
      return allTracks.filter(t => t.genreList.some(g => selectedGenres.has(g)));
    }

    function updatePreview() {
      const matches = getMatchingTracks();
      document.getElementById('preview').innerHTML =
        `<strong>${matches.length} passende Songs:</strong><br>` +
        matches.map(t => `• ${t.artists.join(', ')} – ${t.name}`).join('<br>');
    }

    function toggleTargetInputs() {
      const isNew = document.getElementById('targetMode').value === 'new';
      document.getElementById('newPlaylistName').style.display = isNew ? 'inline-block' : 'none';
      document.getElementById('targetPlaylist').style.display = isNew ? 'none' : 'inline-block';
    }

    async function executeTransfer() {
      const matches = getMatchingTracks();
      if (!matches.length) return alert('Bitte mindestens ein Genre auswählen.');

      const btn = document.getElementById('transferBtn');
      const status = document.getElementById('transferStatus');
      const sourceId = document.getElementById('sourcePlaylist').value;
      const isNew = document.getElementById('targetMode').value === 'new';
      const actionMode = document.querySelector('input[name="actionMode"]:checked').value;

      btn.disabled = true;
      try {
        let targetId = isNew ? null : document.getElementById('targetPlaylist').value;
        if (isNew) {
          const name = document.getElementById('newPlaylistName').value.trim();
          if (!name) throw new Error('Bitte einen Namen für die neue Playlist eingeben.');
          status.textContent = 'Erstelle neue Playlist...';
          const createResp = await spotifyFetch('https://api.spotify.com/v1/me/playlists', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, public: false, description: 'Erstellt mit Spotify Genre Sorter' })
          });
          if (!createResp.ok) throw new Error('Playlist konnte nicht erstellt werden.');
          targetId = (await createResp.json()).id;
        }

        const uris = matches.map(t => t.uri);
        status.textContent = `Füge ${uris.length} Songs hinzu...`;
        for (let i = 0; i < uris.length; i += 100) {
          const chunk = uris.slice(i, i + 100);
          const addResp = await spotifyFetch(`https://api.spotify.com/v1/playlists/${targetId}/items`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uris: chunk })
          });
          if (!addResp.ok) throw new Error('Fehler beim Hinzufügen der Songs.');
        }

        if (actionMode === 'move') {
          status.textContent = 'Entferne Songs aus der Quell-Playlist...';
          for (let i = 0; i < uris.length; i += 100) {
            const chunk = uris.slice(i, i + 100);
            const delResp = await spotifyFetch(`https://api.spotify.com/v1/playlists/${sourceId}/items`, {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ items: chunk.map(uri => ({ uri })) })
            });
            if (!delResp.ok) throw new Error('Songs kopiert, aber Entfernen aus Quelle fehlgeschlagen.');
          }
        }

        status.textContent = `Erledigt! ${uris.length} Songs wurden ${actionMode === 'move' ? 'verschoben' : 'kopiert'}.`;
        await loadPlaylists();
      } catch (err) {
        status.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    }

    // === INIT ===
    (async function init() {
      const savedId = localStorage.getItem('sp_client_id');
      if (savedId) document.getElementById('clientIdInput').value = savedId;

      await handleOAuthCallback();

      if (!localStorage.getItem('sp_access_token')) {
        document.getElementById('loginBox').style.display = 'block';
        return;
      }
      document.getElementById('appBox').style.display = 'block';
      await loadPlaylists();
    })();
  </script>
</body>
</html>
